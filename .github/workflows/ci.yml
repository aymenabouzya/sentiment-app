name: CI
on: [push, pull_request]
jobs:
  tp5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Entraîner le modèle et lancer les tests
        run: |
          python src/make_demo.py
          python src/train.py
          pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy api
      - name: Couverture API
        run: pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
